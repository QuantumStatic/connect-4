<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Connect 4</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0f1115; color: #e7e7ea; font-family: system-ui, sans-serif; height: 100%; }
      #app { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
      canvas { display: block; border-radius: 8px; }
      .hud { display: flex; gap: 12px; align-items: center; }
      .hud button, .hud select { background: #1c2030; color: #e7e7ea; border: 1px solid #2c3146; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
      .hud button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status { min-width: 220px; display: inline-flex; align-items: center; gap: 8px; }
      .think-dot { width: 9px; height: 9px; border-radius: 50%; background: #e6c437; opacity: 0; transform: scale(0.6); transition: opacity 120ms; }
      .status.thinking .think-dot { opacity: 1; animation: think-pulse 0.9s ease-in-out infinite; }
      .status.thinking { color: #e6c437; }
      @keyframes think-pulse { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1); opacity: 1; } }
      .toast { position: fixed; top: 16px; right: 16px; background: #3b1d1d; border: 1px solid #6b2a2a; padding: 8px 12px; border-radius: 6px; }
      .linkbox { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      .link-input { width: 280px; background: #11141d; color: #e7e7ea; border: 1px solid #2c3146; border-radius: 6px; padding: 6px 8px; }
      .conn-chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid #2c3146; }
      .conn-chip[data-state="connected"] { color: #3aa05a; border-color: #2f6b43; }
      .conn-chip[data-state="reconnecting"] { color: #e6c437; border-color: #6b5e1a; }
      .conn-chip[data-state="disconnected"], .conn-chip[data-state="connecting"] { color: #c46; border-color: #6b2a3a; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="hud" id="hud"></div>
      <div id="canvas-host"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
