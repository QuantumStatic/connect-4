<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Connect 4</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0f1115; color: #e7e7ea; font-family: system-ui, sans-serif; height: 100%; }
      #app {
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 6px 8px calc(16px + env(safe-area-inset-bottom));
        min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      }
      canvas { display: block; border-radius: 8px; }
      /* Board first; sized to fit BOTH axes (width on phones, height on desktop),
         preserving aspect, never larger than its natural 648px. The element box
         equals the rendered board, so click mapping stays correct. */
      #canvas-host { order: 0; width: 100%; display: flex; justify-content: center; }
      /* Grow to fill the viewport: width fills phones; on desktop the height
         budget (capped at 720px so it's never humongous) drives the size via the
         board's 648:640 aspect. Element box == board, so clicks stay correct. */
      #canvas-host canvas {
        width: 100%; height: auto;
        max-width: calc(min(78dvh, 720px) * 1.0125);
        max-height: min(78dvh, 720px);
      }
      .hud { order: 1; display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; justify-content: center; width: 100%; }
      .hud button, .hud select {
        background: #1c2030; color: #e7e7ea; border: 1px solid #2c3146;
        padding: 14px 20px; border-radius: 12px; cursor: pointer;
        font-size: 18px; min-height: 60px; flex: 1 1 auto; min-width: 90px;
      }
      /* On phones: stack controls full-width so each is a comfortable tap target */
      @media (max-width: 640px) {
        .hud button, .hud select { flex: 0 0 100%; min-width: 0; }
      }
      /* On desktop: compact controls in a single row, capped to the board width. */
      @media (min-width: 641px) {
        .hud { max-width: 560px; }
        .hud button, .hud select {
          padding: 8px 14px; font-size: 15px; min-height: 0;
          border-radius: 8px; flex: 0 1 auto;
        }
      }
      .hud button:disabled { opacity: 0.5; cursor: not-allowed; }
      .hud button.end-room { border-color: #6b2a3a; color: #e88; }
      .p2p-toggle { font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 48px; }
      .status { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; width: 100%; justify-content: center; }
      .think-dot { width: 9px; height: 9px; border-radius: 50%; background: #e6c437; opacity: 0; transform: scale(0.6); transition: opacity 120ms; }
      .status.thinking .think-dot { opacity: 1; animation: think-pulse 0.9s ease-in-out infinite; }
      .status.thinking { color: #e6c437; }
      @keyframes think-pulse { 0%, 100% { transform: scale(0.6); opacity: 0.5; } 50% { transform: scale(1); opacity: 1; } }
      .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: 90vw; text-align: center; background: #3b1d1d; border: 1px solid #6b2a2a; padding: 8px 12px; border-radius: 6px; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
      .linkbox { display: flex; gap: 8px; align-items: center; margin-top: 4px; width: 100%; flex-wrap: wrap; }
      .link-input { width: 100%; min-width: 0; background: #11141d; color: #e7e7ea; border: 1px solid #2c3146; border-radius: 6px; padding: 8px; font-size: 13px; }
      .conn-chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid #2c3146; white-space: nowrap; }
      .conn-chip[data-state="connected"] { color: #3aa05a; border-color: #2f6b43; }
      .conn-chip[data-state="reconnecting"] { color: #e6c437; border-color: #6b5e1a; }
      .conn-chip[data-state="disconnected"], .conn-chip[data-state="connecting"] { color: #c46; border-color: #6b2a3a; }
      .side-chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid #2c3146; font-weight: 600; margin-right: 6px; white-space: nowrap; }
      .side-chip[data-side="yellow"] { color: #e6c437; border-color: #6b5e1a; }
      .side-chip[data-side="green"] { color: #3aa05a; border-color: #2f6b43; }
      .score-chip { padding: 4px 10px; border-radius: 999px; font-size: 13px; border: 1px solid #2c3146; font-weight: 600; margin-right: 6px; background: #11141d; color: #e7e7ea; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="canvas-host"></div>
      <div class="hud" id="hud"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
